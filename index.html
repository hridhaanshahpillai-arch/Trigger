<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRIGGER</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<script>
'use strict';
// TRIGGER: a street fighter with guns. Phase 1: Rex vs Mako, two players on one keyboard.
// Everything is drawn at 320x180 and scaled up in whole pixels.

const W = 320, H = 180, FLOOR = 160, OUT = '#1b1225';
const screen = document.getElementById('screen'), sctx = screen.getContext('2d');
const low = document.createElement('canvas');
low.width = W; low.height = H;
const ctx = low.getContext('2d', { willReadFrequently: true });
let S = 1;
function fit() {
  S = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
  screen.width = W * S; screen.height = H * S;
}
addEventListener('resize', fit);
fit();

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v * k)));
  return '#' + ((1 << 24) | (f(n >> 16) << 16) | (f((n >> 8) & 255) << 8) | f(n & 255)).toString(16).slice(1);
}
function mulberry(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

// ---------------------------------------------------------------- fighters and their guns
const ROSTER = ['rex', 'mako', 'vex', 'bolt'];
// everyone is the same plain fighter (same body, same speed, no hair): only the gun is different
const BODY = { skin: '#f0b088', shirt: '#e8463c', sleeve: '#e8463c', pants: '#2f3a66', shoe: '#f4f0e6', belt: '#2f3a66', glove: '#f0b088' };
const FIGHTERS = {
  rex:  { name: 'PISTOL',  gun: 'pistol',  tw: 10, c: BODY, desc: 'ALL-ROUNDER' },
  mako: { name: 'SHOTGUN', gun: 'shotgun', tw: 10, c: BODY, desc: 'UP CLOSE', twoHand: true },
  vex:  { name: 'SNIPER',  gun: 'sniper',  tw: 10, c: BODY, desc: 'KEEP AWAY', twoHand: true },
  bolt: { name: 'SMG',     gun: 'smg',     tw: 10, c: BODY, desc: 'RUSHDOWN' },
};
const GUNS = {
  // mag is all the ammo you get for the whole round: there's no reloading
  pistol:  { mag: 6,  startup: 4,  recover: 11, dmg: 6,  speed: 6,   pellets: 1, spread: 0,  life: 70, kb: 1,   stun: 12, muzzle: 18, recoil: 0.4, shake: 1 },
  shotgun: { mag: 2,  startup: 7,  recover: 24, dmg: 5,  speed: 6.5, pellets: 4, spread: .7, life: 15, kb: 1.6, stun: 16, muzzle: 22, recoil: 1.5, shake: 3 },
  sniper:  { mag: 3,  startup: 14, recover: 22, dmg: 16, speed: 11,  pellets: 1, spread: 0,  life: 40, kb: 3,   stun: 24, muzzle: 29, recoil: 1,   shake: 4 },
  smg:     { mag: 15, startup: 3,  recover: 16, dmg: 3,  speed: 7,   pellets: 1, spread: 0,  life: 60, kb: .5,  stun: 8,  muzzle: 20, recoil: .2,  shake: 1, burst: 3, gap: 4 },
};
// hit boxes are measured from the feet, forwards and up
const ATTACKS = {
  punch: { name: 'punch', start: 4, active: 3,  rec: 9,  dmg: 6,  x: 6, w: 15, y: -34, h: 9,  stun: 15, kb: 1.4, stop: 5 },
  kick:  { name: 'kick',  start: 8, active: 4,  rec: 14, dmg: 11, x: 4, w: 19, y: -21, h: 11, stun: 20, kb: 3,   stop: 7 },
  jkick: { name: 'jkick', start: 0, active: 99, rec: 0,  dmg: 8,  x: 3, w: 17, y: -21, h: 13, stun: 17, kb: 2,   stop: 6 },
  // down + punch: a rising uppercut that reaches high and launches; down + kick: a sweep along the floor that trips
  upper: { name: 'upper', start: 5, active: 5,  rec: 18, dmg: 10, x: 2, w: 15, y: -50, h: 32, stun: 20, kb: 1,   stop: 8, launch: true },
  sweep: { name: 'sweep', start: 7, active: 4,  rec: 20, dmg: 8,  x: 4, w: 24, y: -9,  h: 9,  stun: 20, kb: 1.2, stop: 6, low: true, trip: true },
};
const THROW = { start: 3, range: 24, dmg: 12, whiff: 22, length: 20 };

// ---------------------------------------------------------------- pixel art, drawn by code
// Each frame is drawn in three layers (back limbs, body, front arm) and every layer gets
// its own thick (2 pixel) dark outline, so the parts read clearly even where they overlap.
const SZ = 64, GX = 32, GY = 52;
let G;
function px(x, y, c) { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < SZ && y < SZ) G[y * SZ + x] = c; }
function rect(x, y, w, h, c) { x = Math.round(x); y = Math.round(y); for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(x + i, y + j, c); }
function disc(cx, cy, r, c, test) {
  for (let y = -r - 1; y <= r + 1; y++) for (let x = -r - 1; x <= r + 1; x++)
    if (x * x + y * y <= r * r + r * .6 && (!test || test(cx + x, cy + y))) px(cx + x, cy + y, c);
}
function seg(a, b, t, c) {
  const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) * 2));
  for (let i = 0; i <= n; i++) {
    const x = a[0] + (b[0] - a[0]) * i / n, y = a[1] + (b[1] - a[1]) * i / n;
    rect(Math.round(x - t / 2 + .01), Math.round(y - t / 2 + .01), t, t, c);
  }
}
// where a knee (bends forwards) or an elbow (bends down) goes between two points
function joint(a, b, L, down) {
  const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, h = Math.sqrt(Math.max(0, L * L - d * d / 4));
  let ux = -dy / d, uy = dx / d;
  if (down ? uy < 0 : ux < 0) { ux = -ux; uy = -uy; }
  return [(a[0] + b[0]) / 2 + ux * h, (a[1] + b[1]) / 2 + uy * h];
}
function ring(g, diagonal) {
  const o = g.slice();
  for (let y = 0; y < SZ; y++) for (let x = 0; x < SZ; x++) {
    if (g[y * SZ + x]) continue;
    const at = (dx, dy) => { const X = x + dx, Y = y + dy; return X >= 0 && Y >= 0 && X < SZ && Y < SZ && g[Y * SZ + X]; };
    if (at(-1, 0) || at(1, 0) || at(0, -1) || at(0, 1) || (diagonal && (at(-1, -1) || at(1, -1) || at(-1, 1) || at(1, 1)))) o[y * SZ + x] = OUT;
  }
  return o;
}
function layer(fn) {
  G = new Array(SZ * SZ).fill(null);
  fn();
  return ring(ring(G, false), true);
}

// greys that survive on the white fighters (for hat details and gun skin patterns); everything else turns white
const G1 = '#343434', G2 = '#646464', G3 = '#a0a0a0', G4 = '#d7d7d7', KEEP = new Set([G1, G2, G3, G4]);
// gun skins: black and white patterns painted over the gun
function skinPixel(skin, x, y) {
  const h = ((x * 73856093) ^ (y * 19349663)) >>> 0;
  switch (skin) {
    case 'skin_stripes': return (x + y) % 4 < 2 ? G2 : '#ffffff';
    case 'skin_dots': return x % 3 === 0 && y % 2 === 0 ? G1 : '#ffffff';
    case 'skin_checker': return ((x >> 1) + (y >> 1)) % 2 ? G1 : '#ffffff';
    case 'skin_camo': { const n = (((x >> 2) * 7 + (y >> 1) * 13 + ((x + y) >> 3) * 5) % 4); return [G1, G2, G3, '#ffffff'][n]; }
    case 'skin_zebra': return (x * 2 + y * 3 + (h % 2)) % 6 < 2 ? G1 : '#ffffff';
    case 'skin_chrome': return y % 3 === 0 ? G3 : (x + y) % 7 === 0 ? G2 : '#ffffff';
    case 'skin_shadow': return x % 5 === 0 ? G2 : G1;
    case 'skin_tiger': return (x + ((y * 3) % 5)) % 5 < 2 ? G1 : G3;
    default: return '#ffffff';
  }
}
// hats, drawn on the head (hc is the middle of the head, facing right)
function drawHat(hat, hc) {
  const W_ = '#ffffff', [x, y] = hc;
  switch (hat) {
    case 'hat_cap': disc(x, y - 1, 5, W_, (a, b) => b <= y - 2); rect(x + 2, y - 3, 6, 2, W_); rect(x - 4, y - 3, 6, 1, G2); break;
    case 'hat_headband': rect(x - 5, y - 3, 11, 2, G1); rect(x - 9, y - 2, 4, 1, G1); rect(x - 10, y - 1, 3, 1, G1); break;
    case 'hat_beanie': disc(x, y - 1, 6, W_, (a, b) => b <= y - 1); rect(x - 6, y - 2, 13, 2, G2); rect(x - 1, y - 9, 3, 2, W_); break;
    case 'hat_party':
      for (let k = 0; k < 9; k++) rect(x - 4 + Math.round(k / 2), y - 5 - k, 9 - k, 1, k % 3 === 1 ? G2 : W_);
      rect(x - 1, y - 16, 3, 2, W_); break;
    case 'hat_cowboy': rect(x - 9, y - 5, 19, 2, W_); rect(x - 4, y - 11, 9, 6, W_); rect(x - 4, y - 7, 9, 1, G1); px(x, y - 11, null); break;
    case 'hat_tophat': rect(x - 7, y - 5, 15, 2, W_); rect(x - 4, y - 15, 9, 10, W_); rect(x - 4, y - 8, 9, 2, G1); break;
    case 'hat_horns': rect(x - 5, y - 7, 2, 3, G1); rect(x - 6, y - 9, 2, 2, G1); rect(x + 3, y - 7, 2, 3, G1); rect(x + 4, y - 9, 2, 2, G1); break;
    case 'hat_crown':
      rect(x - 5, y - 8, 11, 3, W_); rect(x - 5, y - 10, 2, 2, W_); rect(x - 1, y - 11, 2, 3, W_); rect(x + 4, y - 10, 2, 2, W_);
      px(x, y - 7, G1); px(x - 3, y - 7, G2); px(x + 3, y - 7, G2); break;
    case 'hat_halo': rect(x - 3, y - 11, 7, 1, W_); rect(x - 4, y - 10, 9, 1, W_); rect(x - 3, y - 9, 7, 1, W_); rect(x - 2, y - 10, 5, 1, G3); break;
    case 'hat_viking':
      disc(x, y - 1, 6, W_, (a, b) => b <= y - 2); rect(x - 6, y - 3, 13, 1, G2);
      rect(x - 8, y - 5, 2, 2, W_); rect(x - 9, y - 8, 2, 3, W_); rect(x + 7, y - 5, 2, 2, W_); rect(x + 8, y - 8, 2, 3, W_); break;
  }
}

function renderGrid(f, p, o = {}) {
  const c = f.c, gx = GX, gy = GY, hy = p.hy;
  const hip = [gx + (p.hx || 0), gy - hy], lean = p.lean || 0;
  const top = [hip[0] + lean, hip[1] - 12];
  const fs = [top[0] + 2, top[1] + 3], bs = [top[0] - 2, top[1] + 3];
  const ff = [gx + p.ff[0], gy - 2 - p.ff[1]], bf = [gx + p.bf[0], gy - 2 - p.bf[1]];
  const fh = [fs[0] + p.fh[0], fs[1] + p.fh[1]], bh = [bs[0] + p.bh[0], bs[1] + p.bh[1]];
  const leg = (foot, col, shoe) => {
    const k = joint(hip, foot, foot === ff && p.kneeLeg ? p.kneeLeg : 8.6, false);
    seg(hip, k, 4, col); seg(k, foot, 4, col);
    rect(foot[0] - 2, foot[1] - 1, 6, 3, shoe);
  };
  const arm = (sh, hand, sleeve, skin, glove) => {
    const e = joint(sh, hand, 5.6, true);
    seg(sh, e, 3, sleeve); seg(e, hand, 3, skin);
    rect(hand[0] - 2, hand[1] - 2, 4, 4, glove);
  };
  const GUN = 'GUN';                 // gun pixels are marked, then painted with the gun skin at the end
  const gun = h => {
    if (f.gun === 'pistol') {
      rect(h[0] - 1, h[1] - 3, 8, 2, GUN); rect(h[0] - 1, h[1] - 1, 3, 3, GUN);
    } else if (f.gun === 'sniper') {
      rect(h[0] - 8, h[1] - 3, 26, 2, GUN); rect(h[0], h[1] - 6, 8, 2, GUN); rect(h[0] - 12, h[1] - 2, 6, 3, GUN);
    } else if (f.gun === 'smg') {
      rect(h[0] - 2, h[1] - 3, 11, 3, GUN); rect(h[0] + 3, h[1], 2, 4, GUN);
    } else {
      rect(h[0] - 7, h[1] - 3, 19, 2, GUN); rect(h[0] - 10, h[1] - 2, 6, 3, GUN); rect(h[0] + 4, h[1] - 1, 5, 2, GUN);
    }
  };
  // the SHARD cloak (a nod to SHARD): a cape from the shoulders, covered in little crystals, with a jagged crystal hem
  const cape = o.cloak ? layer(() => {
    // it ripples (wave = 0..3, which moment of the ripple) and streams out further when you move (flare)
    const wave = o.wave || 0, flare = o.flare || 0;
    const y0 = top[1] + 1, y1 = Math.min(gy - 5, hip[1] + 13) - flare * 3;
    for (let y = y0; y <= y1; y++) {
      const t = (y - y0) / (y1 - y0), ripple = Math.sin(t * Math.PI * 2 - wave * Math.PI / 2) * t * (1.2 + flare);
      const xa = Math.round(top[0] - 5 - t * (14 + flare * 5) - (lean < 0 ? -lean : 0) + ripple), xb = Math.round(top[0] + 1 - t * (5 + flare * 2) + ripple * .5);
      for (let x = xa; x <= xb; x++) {
        const fromBottom = y1 - y, k = (x - xa + wave) % 4;
        if ((fromBottom === 0 && k >= 2) || (fromBottom === 1 && k === 3)) continue;     // the shard-shaped hem
        px(x, y, '#ffffff');
      }
    }
    const shard = (cx, cy) => { px(cx, cy - 1, G2); px(cx - 1, cy, G2); px(cx, cy, G3); px(cx + 1, cy, G2); px(cx, cy + 1, G2); };
    const mx = top[0] - 8, my = y0;
    shard(mx - 1, my + 6); shard(mx - 5, my + 14); shard(mx - 11, my + 20); shard(mx - 2, my + 21);
    // the big crystal emblem, out where it shows
    rect(mx - 6, my + 8, 1, 8, G1); rect(mx - 7, my + 9, 3, 6, G1); px(mx - 6, my + 10, G4); px(mx - 6, my + 11, G4);
  }) : null;
  if (o.cloakOnly) return cape;                          // just the cloak, for the shop and locker pictures
  const back = layer(() => {
    leg(bf, shade(c.pants, .68), shade(c.shoe, .7));
    arm(bs, bh, shade(c.sleeve, .7), shade(c.skin, .76), shade(c.glove, .72));
  });
  const body = layer(() => {
    for (let y = top[1]; y <= hip[1]; y++) {
      const t = (hip[1] - y) / 12, cx = hip[0] + lean * t, w = f.tw + (y < top[1] + 3 ? 1 : 0);
      rect(Math.round(cx - w / 2), y, w, 1, c.shirt);
    }
    rect(hip[0] - f.tw / 2, hip[1] - 1, f.tw, 2, c.belt);
    // a plain round head: no hair, just an eye so you can tell which way they face
    const hc = [top[0] + 1 + (p.headX || 0), top[1] - 5 + (p.headY || 0)];
    rect(top[0] - 1, top[1] - 2, 3, 3, c.skin);
    disc(hc[0], hc[1], 5, c.skin);
    rect(hc[0] + 3, hc[1] - 1, 1, 2, OUT);
    if (o.hat) drawHat(o.hat, hc);
    leg(ff, c.pants, c.shoe);
  });
  const front = layer(() => {
    if (p.gun) gun(fh);
    arm(fs, fh, c.sleeve, c.skin, c.glove);
  });
  const out = cape ? cape.slice() : back.slice();
  for (let i = 0; i < out.length; i++) { if (cape && back[i]) out[i] = back[i]; if (body[i]) out[i] = body[i]; if (front[i]) out[i] = front[i]; }
  for (let i = 0; i < out.length; i++) if (out[i] === GUN) out[i] = skinPixel(o.skin, i % SZ, (i / SZ) | 0);
  return out;
}

function poses(f) {
  const base = { hy: 18, lean: 1, ff: [5, 0], bf: [-5, 0], fh: [5, -6], bh: [4, -4] };
  const P = o => Object.assign({}, base, o);
  const two = f.twoHand;
  return {
    idle0: P({}),
    idle1: P({ hy: 17, fh: [5, -5], bh: [4, -3] }),
    walk0: P({ ff: [6, 0], bf: [-5, 0] }),
    walk1: P({ ff: [4, 2], bf: [-5, 0], hy: 19 }),
    walk2: P({ ff: [4, 0], bf: [-3, 0] }),
    walk3: P({ ff: [5, 0], bf: [-3, 2], hy: 19 }),
    crouch: P({ hy: 11, ff: [6, 0], bf: [-6, 0], lean: 2, fh: [5, -3], bh: [4, -2] }),
    jump: P({ ff: [5, 6], bf: [-3, 4], fh: [4, -7], bh: [3, -6] }),
    fall: P({ ff: [4, 2], bf: [-5, 1], fh: [6, -4], bh: [4, -2] }),
    punch0: P({ lean: 0, fh: [0, -2], bh: [5, -5], ff: [6, 0], bf: [-6, 0] }),
    punch1: P({ lean: 3, fh: [12, -3], bh: [2, -2], ff: [8, 0], bf: [-6, 0], headX: 1 }),
    kick0: P({ lean: -1, ff: [4, 8], fh: [3, -5], bh: [-2, -2] }),
    kick1: P({ lean: -3, ff: [15, 13], bf: [-4, 0], fh: [-3, 0], bh: [-4, 2] }),
    jkick: P({ lean: -3, ff: [15, 13], bf: [-3, 5], fh: [-3, 0], bh: [-4, 2] }),
    shoot0: P({ lean: 0, fh: [9, -1], bh: two ? [10, 0] : [3, -2], gun: 1 }),
    shoot1: P({ lean: -2, fh: [7, -3], bh: two ? [8, -2] : [2, -2], headX: -1, gun: 1 }),
    hit: P({ lean: -4, hy: 17, headX: -2, fh: [-2, 2], bh: [-4, 3], ff: [5, 0], bf: [-7, 0] }),
    block: P({ lean: -1, fh: [6, -7], bh: [6, -5], ff: [5, 0], bf: [-6, 0] }),
    cblock: P({ hy: 11, ff: [6, 0], bf: [-6, 0], fh: [6, -5], bh: [6, -4] }),
    dash: P({ lean: 4, ff: [9, 1], bf: [-8, 2], fh: [6, -3], bh: [3, 0], hy: 16 }),
    upper0: P({ hy: 12, lean: 2, ff: [6, 0], bf: [-6, 0], fh: [2, -1], bh: [4, -2] }),
    upper1: P({ hy: 20, lean: 2, ff: [4, 3], bf: [-4, 0], fh: [4, -14], bh: [2, -1], headX: 1 }),
    sweep0: P({ hy: 10, lean: -1, ff: [6, 0], bf: [-6, 0], fh: [4, -2], bh: [3, 0] }),
    sweep1: P({ hy: 9, lean: -4, ff: [17, 1], bf: [-5, 0], fh: [-2, 4], bh: [-4, 5] }),
    throw0: P({ lean: 2, ff: [7, 0], bf: [-6, 0], fh: [10, -2], bh: [10, 0] }),
    throw1: P({ lean: -3, ff: [5, 0], bf: [-7, 0], fh: [3, -12], bh: [1, -11], headX: -1 }),
    // falling over: knocked back, tumbling through the air, flat on the floor (turned on its side below), sitting up
    fall0: P({ lean: -6, hy: 17, headX: -3, headY: 1, fh: [-6, -4], bh: [-7, -2], ff: [8, 6], bf: [-3, 0] }),
    fall1: P({ lean: -10, hy: 14, headX: -3, fh: [-8, -2], bh: [-9, 0], ff: [12, 10], bf: [8, 7] }),
    lie: P({ lean: 0, fh: [-3, 9], bh: [-4, 9], ff: [-4, 7], bf: [-5, 0], kneeLeg: 12 }),   // one knee up (a longer bend so it shows), the other leg flat
    sit: P({ hy: 5, lean: -3, ff: [12, 0], bf: [9, 0], fh: [-4, 8], bh: [-6, 9], headX: -1 }),
  };
}

function toCanvas(grid, flash, fill) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = SZ;
  const x = cv.getContext('2d');
  for (let i = 0; i < grid.length; i++) {
    const col = grid[i];
    if (!col) continue;
    // fighters are plain white inside their black outlines; a hit flashes them solid black
    x.fillStyle = col === OUT ? OUT : flash ? OUT : KEEP.has(col) ? col : fill;
    x.fillRect(i % SZ, (i / SZ) | 0, 1, 1);
  }
  return cv;
}
// turn a standing frame a quarter turn onto its back, pixel for pixel (so it stays crisp):
// head towards the back, feet just in front of where the fighter stands, back on the floor
function lieDown(g) {
  // first find the lowest pixel once turned, so the body (legs and all) rests right on the floor
  let low = 0;
  for (let y = 0; y < SZ; y++) for (let x = 0; x < SZ; x++) if (g[y * SZ + x]) low = Math.max(low, GX - x);
  const o = new Array(SZ * SZ).fill(null);
  for (let y = 0; y < SZ; y++) for (let x = 0; x < SZ; x++) {
    const c = g[y * SZ + x];
    if (!c) continue;
    const x2 = GX + 18 - (GY - y), y2 = GY + 1 - low + (GX - x);
    if (x2 >= 0 && y2 >= 0 && x2 < SZ && y2 < SZ) o[y2 * SZ + x2] = c;
  }
  return o;
}
// frames are drawn the first time they're needed and kept: one per fighter, pose, outfit (white, or
// light grey for the second player in a mirror match), hat and gun skin
const FRAMES = new Map(), POSES = {};
function getFrame(key, name, o = {}) {
  const id = key + '|' + name + '|' + (o.alt ? 1 : 0) + (o.flash ? 1 : 0) + '|' + (o.hat || '') + '|' + (o.skin || '') + '|' + (o.cloak || '') + (o.cloakOnly ? '|only' : '')
    + (o.cloak ? '|' + (o.wave || 0) + (o.flare || 0) : '');
  let cv = FRAMES.get(id);
  if (!cv) {
    const f = FIGHTERS[key], ps = POSES[key] || (POSES[key] = poses(f));
    let g = renderGrid(f, ps[name], o);

// ---------------------------------------------------------------- the computer opponent
// It plays by pressing the same buttons a person would, reacting a bit late (later on easy) and sometimes not at all.
const AI_LEVELS = {
  EASY:   { react: 26, block: .2, anti: .15, shoot: .15, mix: .45 },
  NORMAL: { react: 14, block: .5, anti: .45, shoot: .3,  mix: .8 },
  HARD:   { react: 7,  block: .8, anti: .8,  shoot: .45, mix: 1 },
};
const RANGE = { pistol: 80, shotgun: 30, sniper: 150, smg: 55 };   // where each gun likes to fight from
const ai = { t: 0, move: 0, down: false, tap: null };
function aiInput(p, o) {
  const i = {};
  if (!p || !o) return i;
  const fwd = p.face > 0 ? 'right' : 'left', back = p.face > 0 ? 'left' : 'right';
  if (--ai.t <= 0) aiThink(p, o, AI_LEVELS[game.cpu]);
  if (ai.move > 0) i[fwd] = true; else if (ai.move < 0) i[back] = true;
  if (ai.down) i.down = true;
  if (ai.tap) { for (const k of ai.tap) i[k] = true; ai.tap = null; }   // buttons are tapped for one frame
  return i;
}
function aiThink(p, o, L) {
  ai.t = L.react + (Math.random() * L.react | 0);
  ai.tap = null; ai.down = false;
  if (game.mode !== 'fight' || lying(p)) { ai.move = 0; return; }
  const d = Math.abs(o.x - p.x), want = RANGE[p.f.gun], r = Math.random();
  // a bullet on its way: duck it or back off
  const bullet = bullets.find(b => b.owner !== p && Math.sign(b.vx) === Math.sign(p.x - b.x) && Math.abs(b.x - p.x) < 100);
  if (bullet && r < L.block) { if (Math.random() < .65) { ai.down = true; ai.move = 0; } else ai.move = -1; return; }
  // an attack coming up close: block it (crouching for a sweep)
  if (o.state === 'attack' && d < 45 && r < L.block) { ai.move = -1; ai.down = !!(o.atk && o.atk.low); ai.t = Math.min(ai.t, 10); return; }
  // jumped at: uppercut
  if (o.state === 'jump' && d < 42 && r < L.anti) { ai.down = true; ai.tap = ['punch']; return; }
  if (lying(o)) { ai.move = d > want ? 1 : 0; return; }
  if (d < 24) {
    if (r < L.mix) {
      const m = Math.random();
      if ((o.state === 'block' || o.back) && m < .45) { ai.move = 1; ai.tap = ['punch']; }      // throw someone who just blocks
      else if (m < .4) ai.tap = ['punch'];
      else if (m < .65) ai.tap = ['kick'];
      else if (m < .85) { ai.down = true; ai.tap = ['kick']; }
      else if (p.f.gun === 'shotgun' && p.ammo > 0) ai.tap = ['shoot'];
      else ai.move = -1;
    } else ai.move = -1;
    return;
  }
  // in range with ammo: shoot now and then (it has to last the round)
  if (p.ammo > 0 && d < want + 40 && d > want * .5 && r < L.shoot && o.state !== 'crouch') { ai.tap = ['shoot']; ai.move = 0; return; }
  // otherwise get to its favourite distance; out of ammo, get in close
  const goal = p.ammo > 0 ? want : 18;
  if (d > goal + 15) { ai.move = 1; if (Math.random() < .1) ai.tap = ['up']; }
  else if (d < goal - 15 && p.ammo > 0) ai.move = -1;
  else ai.move = 0;
}

async function submitAuth() {

  if ((f.kind === 'save' || f.kind === 'change') && v[0] !== v[1]) return fail('THE TWO PASSWORDS DON\'T MATCH');
  if (f.kind === 'delete' && v[0] !== 'DELETE') return fail('TYPE THE WORD DELETE TO CONFIRM');

    } else if (f.kind === 'change') {

      if (r.error) return fail(r.error.message);

      const r = await ranked.db.auth.signInWithPassword({ email: emailFor(v[0].trim()), password: v[1] });
      if (r.error) return fail(r.error.message.includes('Invalid') ? 'WRONG NAME OR PASSWORD' : r.error.message);
      ranked.me = null;
      const { data } = await ranked.db.rpc('ensure_player');
      ranked.me = normMe(data);

      const r = await ranked.db.rpc('delete_account');
      if (r.error) return fail(r.error.message);
      await ranked.db.auth.signOut();
      ranked.me = null;

    await checkAnon();

    else { const ch = key.toUpperCase(); if (/[A-Z0-9 ]/.test(ch) && field.value.length < 22) field.value += ch; }
  }
}

// input on the account, shop and crate screens: Q/E switch tabs, WASD or arrows move, Enter does it, Esc goes back
function updateProfileScreens(escPressed, enterPressed) {
  const left = tapped('KeyA', 'ArrowLeft'), right = tapped('KeyD', 'ArrowRight'), up = tapped('KeyW', 'ArrowUp'), down = tapped('KeyS', 'ArrowDown');
  const tabL = tapped('KeyQ'), tabR = tapped('KeyE');
  if (game.mode === 'crate') {
    crateAnim.t++;
    if ((enterPressed || escPressed) && (crateAnim.err || (crateAnim.result && crateAnim.t > 80))) { game.mode = 'shop'; shop.tab = shop.tab || 3; }
    return;
  }
  if (escPressed) { goTo('menu', 0); menu.col = 1; menu.si = game.mode === 'shop' ? 1 : 0; return; }
  const tabs = game.mode === 'shop' ? 4 : 3;
  if (tabL || tabR) { shop.tab = (shop.tab + (tabR ? 1 : tabs - 1)) % tabs; shop.i = 0; shop.row = 0; sfx.click(); return; }
  if (!ranked.me) return;
  if (game.mode === 'account') {
    if (shop.tab === 0) {                                // achievements
      if (up) shop.i = Math.max(0, shop.i - 1);
      if (down) shop.i = Math.min(ACHIEVEMENTS.length - 1, shop.i + 1);
      const a = ACHIEVEMENTS[shop.i];
      if (enterPressed && !ranked.me.claimed.includes(a[0]) && progress(a[3]) >= a[4])
        shopCall('claim_achievement', { aid: a[0] }, () => { shop.msg = '+' + a[5] + ' COINS'; shop.msgT = 150; sfx.rack(); });
    } else if (shop.tab === 2) {                         // login: save, sign in, sign out, delete
      const opts = loginOptions();
      if (up) shop.i = Math.max(0, shop.i - 1);
      if (down) shop.i = Math.min(opts.length - 1, shop.i + 1);
      if (enterPressed && opts[shop.i]) loginAction(opts[shop.i]);
    } else {                                             // locker: what you own
      const list = (ranked.me.owned || []).filter(id => ITEMS[id]);
      gridMove(list.length, 6, left, right, up, down);
      const id = list[shop.i];
      if (enterPressed && id) equip(id);
    }
    return;
  }
  // shop
  if (shop.tab === 0) {                                  // battle pass
    if (left) shop.i = Math.max(0, shop.i - 1);
    if (right) shop.i = Math.min(19, shop.i + 1);
    if (up || down) shop.row ^= 1;
    if (enterPressed) {
      const track = shop.row ? 'premium' : 'free';
      if (track === 'premium' && !ranked.me.premium) shopCall('buy_premium', {}, () => { shop.msg = 'PREMIUM DEMON ROAD UNLOCKED!'; shop.msgT = 150; sfx.rack(); });
      else claimTier(shop.i, track);
    }
  } else if (shop.tab === 3) {                           // crates
    if (left || right) shop.i ^= 1;
    if (enterPressed) {
      const c = CRATES[shop.i];
      if (ranked.me[c[4]] < c[2]) { shop.msg = c[4] === 'keys' ? 'YOU NEED 3 KEYS - WIN CO-OP OR RANKED' : 'NOT ENOUGH COINS'; shop.msgT = 150; sfx.empty(); }
      else openCrate(c[0]);
    }
  } else {                                               // hats or skins
    const list = shop.tab === 1 ? HATS : SKINS;
    gridMove(list.length, 5, left, right, up, down);
    const id = list[shop.i];
    if (enterPressed && id) {
      if (owns(id)) equip(id);
      else if (!ITEMS[id][2]) { shop.msg = 'DEMON ROAD ONLY'; shop.msgT = 120; }
      else shopCall('buy', { item: id }, () => { shop.msg = 'BOUGHT ' + ITEMS[id][0] + '!'; shop.msgT = 150; sfx.rack(); });
    }
  }
}

  if (!n) { shop.i = 0; return; }
  if (left) shop.i = Math.max(0, shop.i - 1);
  if (right) shop.i = Math.min(n - 1, shop.i + 1);
  if (up) shop.i = Math.max(0, shop.i - cols);

function activeBox(p) {

  if (p.state === 'jump' && p.atk) return p.atk;

}
function melee(p, o) {
  const a = activeBox(p);
  if (!a || p.hitDone || lying(o)) return;
  const box = { x: p.face > 0 ? p.x + a.x : p.x - a.x - a.w, y: p.y + a.y, w: a.w, h: a.h };
  if (overlap(box, hurt(o))) {

}
function updateBullets() {
  for (const b of bullets) {
    b.x += b.vx; b.y += b.vy; b.life--;
    const o = b.owner === P1 ? P2 : P1;
    if (!lying(o) && overlap({ x: b.x - 2, y: b.y - 1, w: 4, h: 2 }, hurt(o))) {
      onHit(b.owner, o, { dmg: b.dmg, stun: b.stun, kb: b.kb, stop: 3, bullet: true, face: Math.sign(b.vx), sx: b.x, sy: b.y });

}
function spark(x, y, col, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 2.5;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - .5, g: .15, life: 10 + Math.random() * 8 | 0, col, size: 2, outline: true });
  }

}
function dust(p) {
  for (let i = 0; i < 5; i++)
    parts.push({ x: p.x + Math.random() * 12 - 6, y: FLOOR - 1, vx: (Math.random() - .5) * 1.2, vy: -Math.random() * .6, g: -.01, life: 14 + Math.random() * 8 | 0, col: '#cbb8d8', size: 2 });
}
function updateParts() {
  for (const q of parts) {
    q.x += q.vx; q.y += q.vy; q.vy += q.g; q.life--;
    if (q.bounce && q.y > FLOOR - 1 && q.vy > 0) { q.y = FLOOR - 1; q.vy *= -.4; q.vx *= .6; }
  }
  parts = parts.filter(q => q.life > 0);
  for (const w of pows) w.t++;
  pows = pows.filter(w => w.t < 6);
  for (const f of flashes) f.t--;
  flashes = flashes.filter(f => f.t > 0);
}

function step() {
  T++;
  const enter = KEYS.Enter || KEYS.NumpadEnter || KEYS.Space;
  const enterPressed = enter && !enterHeld && !chat.typing;
  enterHeld = enter;
  const escPressed = KEYS.Escape && !escHeld && !chat.typing;
  escHeld = KEYS.Escape;
  shakeAmt *= .85;
  if (shakeAmt < .3) shakeAmt = 0;

  if (menu.msgT > 0) menu.msgT--;
  for (const k in KEYS) { TAPS[k] = KEYS[k] && !KEYPREV[k]; KEYPREV[k] = KEYS[k]; }
  if (net.role === 'guest') { guestTick(); return; }
  if (game.mode === 'authform') return;                  // typing a name or password: the keyboard goes to the form
  if (game.mode === 'account' || game.mode === 'shop' || game.mode === 'crate') { updateProfileScreens(escPressed, enterPressed); return; }
  if (game.mode === 'menu') {
    // the sidebar (ACCOUNT, SHOP) on the left: A/D to go between it and the main buttons
    if (tapped('KeyA', 'ArrowLeft', 'KeyD', 'ArrowRight')) { menu.col = menu.col ? 0 : 1; menu.si = menu.si || 0; sfx.click(); }
    if (menu.col) {
      if (tapped('KeyW', 'ArrowUp', 'KeyS', 'ArrowDown')) { menu.si ^= 1; sfx.click(); }
      if (escPressed) { menu.col = 0; goTo('title'); }
      else if (enterPressed) choose(SIDEBAR[menu.si]);
      menu.upHeld = KEYS.KeyW || KEYS.ArrowUp; menu.downHeld = KEYS.KeyS || KEYS.ArrowDown;
      return;
    }
  }
  if (game.mode === 'title') { if (enterPressed) { game.mode = 'menu'; menu.i = 0; } return; }
  const list = menuList(game.mode);
  if (list) {
    const up = KEYS.KeyW || KEYS.ArrowUp, down = KEYS.KeyS || KEYS.ArrowDown;
    if (up && !menu.upHeld) { menu.i = (menu.i + list.length - 1) % list.length; sfx.click(); }
    if (down && !menu.downHeld) { menu.i = (menu.i + 1) % list.length; sfx.click(); }
    menu.upHeld = up; menu.downHeld = down;
    if (escPressed) goBack();
    else if (enterPressed) choose(list[menu.i]);
    return;
  }
  if (game.mode === 'board' || game.mode === 'controls') { if (escPressed || enterPressed) goBack(); return; }
  if (game.mode === 'pickname') {
    if (escPressed) goTo('play', 1);
    else if (KEYS.Enter && !menu.enterHeld && ranked.typed.trim().length >= 3) saveName();    // Enter only (Space types a space)
    menu.enterHeld = KEYS.Enter;
    return;
  }
  if (game.mode === 'join') {
    if (escPressed) goBack();
    else if (enterPressed && net.typed.length === 4) joinGame();
    return;
  }
  if (game.mode === 'lobby') { if (escPressed) leaveOnline(); return; }
  if (game.mode === 'select') {
    game.t++;
    if (escPressed) {
      if (net.role) leaveOnline();
      else if (game.cpu) goTo('difficulty', MENUS.difficulty.indexOf(game.cpu));
      else goTo('coop', 2);
    }
    else updateSelect(enterPressed);
    return;
  }
  if (escPressed) {
    if (game.searching) stopSearch();                   // stop looking for a ranked opponent
    else if (net.ranked) leaveOnline('YOU LEFT - THAT COUNTS AS A LOSS');
    else openSelect();
    return;
  }
  if (game.searching) {
    ranked.searchT++;
    if (T - ranked.lastQueue > 600 && net.peer && net.peer.open) queueUp();    // check the queue again every 10 seconds
  }
  for (const p of [P1, P2]) {                           // presses made during a hit freeze count once it ends
    readInput(p);
    p.pend = p.pend || {};
    for (const k in p.pr) {
      if (stop > 0) { if (p.pr[k]) p.pend[k] = true; }
      else if (p.pend[k]) { p.pr[k] = true; p.pend[k] = false; }
    }
  }
  game.t++;

  const slow = game.mode === 'ko' && game.t < 45 && T % 3 !== 0;     // the knockout plays in slow motion
  if (stop > 0) stop--;
  else if (!slow) {
    act(P1, P2); act(P2, P1);
    physics(P1); physics(P2);
    separate();
    melee(P1, P2); melee(P2, P1);
    updateBullets();
    updateParts();
  }
  for (const p of [P1, P2]) {
    if (p.hpDelay > 0) p.hpDelay--;
    else if (p.shownHp > p.hp) p.shownHp = Math.max(p.hp, p.shownHp - .8);
    if (p.bubbleT > 0) p.bubbleT--;
    if (p.chatCD > 0) p.chatCD--;
  }

  if (game.mode === 'intro' && game.t >= 80) { game.mode = 'fight'; game.t = 0; }
  else if (game.mode === 'fight') {
    if (game.t % 60 === 0 && game.timer > 0) {
      game.timer--;
      if (game.timer === 0) endRound(P1.hp > P2.hp ? P1 : P2.hp > P1.hp ? P2 : null, 'TIME');
    }
  } else if (game.mode === 'ko' && game.t >= 170) {
    if (P1.wins >= 2 || P2.wins >= 2) {
      if (game.searching) { picks = [picks[0], ROSTER[Math.random() * 4 | 0]]; startMatch(); return; }   // still waiting: another warm-up
      game.mode = 'over'; game.t = 0;
      if (net.ranked) reportResult(P1.wins >= 2 ? ranked.hostId : ranked.guestId);
      else if (net.role === 'host') giveReward('coop', '', P1.wins >= 2);          // online co-op win: 6 coins
      else if (game.cpu) giveReward('bot', game.cpu, P1.wins >= 2);                // bot win: 1, 2 or 3 coins
      if (game.cpu) say(P2, 0);                         // the computer is a good sport: GG
    } else { game.round++; startRound(); }
  } else if (game.mode === 'over') {
    const re = !!net.remote.enter, rePressed = re && !net.remoteEnterHeld;     // either player can call the rematch
    net.remoteEnterHeld = re;
    if (net.ranked) { if (enterPressed) leaveOnline('MATCH OVER'); }           // no rematches in ranked
    else if (enterPressed || rePressed) startMatch();
  }
}
function goTo(mode, i = 0) { game.mode = mode; menu.i = i; }
function goBack() {
  // back to the menu this one came from, with the cursor on the option that led here
  const from = game.mode, to = PARENT[from] || 'title';
  const came = { play: 'PLAY', settings: 'SETTINGS', coop: 'CO-OP', difficulty: 'VS BOT', ranked: 'RANKED', controls: 'CONTROLS', board: 'LEADERBOARD', join: 'JOIN' }[from];
  const list = menuList(to);
  goTo(to, list ? Math.max(0, list.findIndex(s => s === came)) : 0);
}
function choose(item) {
  sfx.click();
  if (item === 'PLAY') goTo('play');
  else if (item === 'SETTINGS') { goTo('settings'); loadMics(false); }
  else if (item.startsWith('MIC:')) nextMic();
  else if (item === 'VS BOT') goTo('difficulty', 1);
  else if (MENUS.difficulty.includes(item)) { game.cpu = item; openSelect(); }
  else if (item === 'RANKED') { ranked.after = 'ranked'; openRanked(); }
  else if (item === 'ACCOUNT') needProfile('account');
  else if (item === 'SHOP') needProfile('shop');
  else if (item === 'CO-OP') goTo('coop');
  else if (item === 'HOST') { game.cpu = null; hostGame(); }
  else if (item === 'JOIN') { game.cpu = null; game.mode = 'join'; net.typed = ''; }
  else if (item === 'SAME KEYBOARD') { game.cpu = null; openSelect(); }
  else if (item === 'FIND MATCH') findMatch();
  else if (item === 'LEADERBOARD') { if (ranked.me) openBoard(); }
  else if (item.startsWith('SOUND')) { settings.sound = !settings.sound; saveSettings(); }
  else if (item.startsWith('SCREEN SHAKE')) { settings.shake = !settings.shake; saveSettings(); }
  else if (item.startsWith('CHAT FILTER')) { settings.filter = !settings.filter; saveSettings(); }
  else if (item.startsWith('HEAR VOICE')) { settings.hearVoice = !settings.hearVoice; saveSettings(); applyVolume(); }
  else if (item === 'CONTROLS') goTo('controls');
  else if (item === 'BACK') goBack();
}

// ---------------------------------------------------------------- drawing
function frameName(p) {
  switch (p.state) {
    case 'idle': return Math.floor(T / 24) % 2 ? 'idle1' : 'idle0';
    case 'walk': return 'walk' + (Math.floor(p.walkT / 5) % 4);
    case 'crouch': return 'crouch';
    case 'jump': return p.atk ? 'jkick' : p.vy < 0 ? 'jump' : 'fall';
    case 'attack': { const a = p.atk; return a.name + (p.t >= a.start && p.t < a.start + a.active + (a.rec >> 1) ? '1' : '0'); }
    case 'shoot': return p.sinceFire < 4 ? 'shoot1' : 'shoot0';
    case 'block': return p.in.down ? 'cblock' : 'block';
    case 'dash': return 'dash';
    case 'throw': return p.caught && p.t >= 6 ? 'throw1' : 'throw0';
    case 'down': case 'ko':
      if (p.bounced) return 'lie';
      return p.koT < 8 ? 'fall0' : 'fall1';
    case 'getup': return p.t < 7 ? 'sit' : 'crouch';
    default: return 'hit';
  }
}
function drawFighter(p, name) {
  const cos = p.cos || {};

  const moving = ['walk', 'dash', 'jump', 'hit'].includes(p.state) || p.y < FLOOR;
  const wave = cos.cloak ? Math.floor(T / (moving ? 5 : 9) + p.id * 2) % 4 : 0, flare = cos.cloak && moving ? 1 : 0;
  const img = getFrame(p.key, name || frameName(p), { alt: p.skin !== p.key, flash: p.flash > 0, hat: cos.hat, skin: cos.skin, cloak: cos.cloak, wave, flare });
  const lift = Math.max(0, FLOOR - p.y);
  if (game.mode !== 'select') {
    ctx.fillStyle = 'rgba(20,10,30,.45)';
    const sw = Math.max(6, 14 - lift / 6);
    ctx.fillRect(Math.round(p.x - sw), FLOOR, Math.round(sw * 2), 2);
  }
  ctx.save();
  ctx.translate(Math.round(p.x), Math.round(p.y));
  if (p.face < 0) ctx.scale(-1, 1);
  ctx.drawImage(img, -GX, -GY);
  ctx.restore();
}
function drawWorld() {
  ctx.drawImage(BG, 0, 0);
  if (!P1) return;
  const order = (P1.state === 'attack' || P1.state === 'shoot') ? [P2, P1] : [P1, P2];
  for (const p of order) drawFighter(p);
  drawBubbles();
  for (const b of bullets) {
    ctx.fillStyle = OUT;
    if (b.big) { ctx.fillRect(Math.round(b.x) - 2, Math.round(b.y) - 2, 4, 4); ctx.fillStyle = '#ffe680'; ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 1, 2, 2); }
    else if (b.gun === 'sniper') {

      ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(b.x) - 5, Math.round(b.y) - 1, 10, 2);
      ctx.fillStyle = 'rgba(200,240,255,.4)'; ctx.fillRect(Math.round(b.x - b.vx * 3) - 10, Math.round(b.y) - 1, 20, 1);
    } else {
      ctx.fillRect(Math.round(b.x) - 3, Math.round(b.y) - 2, 7, 4);
      ctx.fillStyle = '#fff27a'; ctx.fillRect(Math.round(b.x) - 2, Math.round(b.y) - 1, 5, 2);
      ctx.fillStyle = 'rgba(255,240,150,.35)'; ctx.fillRect(Math.round(b.x - b.vx * 2) - 4, Math.round(b.y) - 1, 6, 1);

    ctx.fillStyle = '#ffb347'; ctx.fillRect(f.x + (f.face > 0 ? 0 : -6 * s), f.y - 2 * s, 7 * s, 4 * s);
    ctx.fillStyle = '#fff6c8'; ctx.fillRect(f.x + (f.face > 0 ? 0 : -3 * s), f.y - 1 * s, 4 * s, 2 * s);
  }
  for (const q of parts) {
    if (q.outline) { ctx.fillStyle = OUT; ctx.fillRect(Math.round(q.x) - 1, Math.round(q.y) - 1, q.size + 2, q.size + 2); }
    ctx.fillStyle = q.col; ctx.fillRect(Math.round(q.x), Math.round(q.y), q.size, q.size);
  }
  for (const w of pows) {

function cutCorners(x, y, w, h, col) {

  for (const s of sel) {
    const x = gx + (s.i & 1) * (bs + gap), y = gy + (s.i >> 1) * (bs + gap);
    const col = s.id === 0 ? '#ff4d4d' : '#4da6ff', inset = (sel[0].i === sel[1].i && s.id === 1) ? 3 : 0;
    const blink = s.done || T % 30 < 22;
    if (blink) {
      ctx.fillStyle = col;
      ctx.fillRect(x - 3 + inset, y - 3 + inset, bs + 6 - inset * 2, 2); ctx.fillRect(x - 3 + inset, y + bs + 1 - inset, bs + 6 - inset * 2, 2);
      ctx.fillRect(x - 3 + inset, y - 3 + inset, 2, bs + 6 - inset * 2); ctx.fillRect(x + bs + 1 - inset, y - 3 + inset, 2, bs + 6 - inset * 2);
    }
    text(s.id === 0 ? '1P' : '2P', s.id === 0 ? x + 2 : x + bs - 2, s.id === 0 ? y + 2 : y + bs - 7, 1, col, s.id === 0 ? 'left' : 'right');
  }
  // the chosen fighters, big, either side
  for (const s of sel) {
    const k = ROSTER[s.i], f = FIGHTERS[k], show = selShow[s.id];
    const skin = s.id === 1 && sel[0].i === sel[1].i ? k + '_alt' : k;
    if (show.key !== k || show.skin !== skin) { Object.assign(show, makePlayer(s.id, k, skin)); resetPlayer(show, 0, s.id === 0 ? 1 : -1); }
    show.cos = cosFor(s.id);
    // drawn at the same pixel size as everything else, so it's just as sharp
    const cx = s.id === 0 ? 50 : 270;
    show.x = cx; show.y = 112;
    drawFighter(show, s.done && game.t % 40 < 4 && !game.ready ? 'shoot1' : 'shoot0');
    text(f.name, cx, 122, 2, '#ffffff', 'center');
    text(f.desc, cx, 136, 1, '#ffffff', 'center');
    if (s.done) text('READY!', cx, 22, 2, '#ffd93d', 'center');
  }
  if (game.ready) text('GET READY!', 160, 130, 1, '#ffd93d', 'center');
  else { text('PUNCH - LOCK IN', 160, 130, 1, '#ffffff', 'center'); text('KICK - CHANGE', 160, 139, 1, '#ffffff', 'center'); }
}
function present() {
  sctx.imageSmoothingEnabled = false;
  const ox = Math.round((Math.random() * 2 - 1) * shakeAmt) * S, oy = Math.round((Math.random() * 2 - 1) * shakeAmt) * S;
  sctx.fillStyle = '#000000'; sctx.fillRect(0, 0, screen.width, screen.height);
  sctx.drawImage(low, ox, oy, W * S, H * S);
}
// black and white: every frame is turned into a few hard greys. Blood is drawn afterwards, so it stays red.
const GREYS = [14, 52, 100, 160, 215, 255];
const MONO = new Uint8Array(256);
for (let v = 0; v < 256; v++) {
  const c = Math.max(0, Math.min(255, (v - 128) * 1.3 + 128));
  let best = 0;
  for (const g of GREYS) if (Math.abs(g - c) < Math.abs(best - c)) best = g;
  MONO[v] = best;
}
function mono() {
  const img = ctx.getImageData(0, 0, W, H), d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const g = MONO[(d[i] * 77 + d[i + 1] * 150 + d[i + 2] * 29) >> 8];
    d[i] = d[i + 1] = d[i + 2] = g;
  }
  ctx.putImageData(img, 0, 0);
}
function drawMenu() {
  ctx.drawImage(BG, 0, 0);
  text('TRIGGER', 160, 20, 5, '#ffffff', 'center');
  const list = menuList(game.mode);
  if (list) {
    const gap = list.length > 6 ? 13 : list.length > 5 ? 14 : 18, top = game.mode === 'ranked' ? 92 : Math.round(104 - list.length * gap / 2);
    if (TITLES[game.mode]) text(TITLES[game.mode], 160, 48, 1, '#ffffff', 'center');
    if (game.mode === 'ranked') {
      if (ranked.me) {
        text(ranked.me.name, 160, 46, 2, '#ffffff', 'center');
        text(rankOf(ranked.me.points) + '  -  ' + ranked.me.points + ' POINTS', 160, 62, 1, '#ffffff', 'center');
        text(ranked.me.wins + ' WINS  ' + ranked.me.losses + ' LOSSES', 160, 72, 1, '#9a9a9a', 'center');
      }
      if (ranked.status) text(ranked.status, 160, 56, 1, '#ffffff', 'center');
    }
    list.forEach((s, k) => {
      const on = k === menu.i && !(game.mode === 'menu' && menu.col);
      text((on ? '> ' : '  ') + s + (on ? ' <' : '  '), 160, top + k * gap, 2, on ? '#ffffff' : '#9a9a9a', 'center');
      const bw = (s.length + 4) * 8;
      hit(game.mode + k, 160 - bw / 2, top + k * gap - 3, bw, gap, () => { menu.col = 0; menu.i = k; choose(s); }, () => { menu.col = 0; menu.i = k; });
    });
    if (game.mode === 'menu') {
      // the sidebar: ACCOUNT and SHOP, plus your coins in the corner
      // small square buttons, just an icon; the name shows beside the one you're on
      SIDEBAR.forEach((s, k) => {
        const on = menu.col && menu.si === k, y = 8 + k * 26;
        box(8, y, 18, 18, on, on ? '#ffffff' : '#e8e8e8');
        if (k === 0) { ctx.fillStyle = OUT; ctx.fillRect(14, y + 2, 6, 6); ctx.fillRect(12, y + 9, 10, 7); ctx.fillStyle = '#ffffff'; ctx.fillRect(15, y + 3, 4, 4); ctx.fillRect(13, y + 10, 8, 6); }
        else drawCoin(14, y + 6);
        if (on) text(s, 32, y + 7, 1, '#ffffff');
        hit('side' + k, 5, y - 3, 24, 24, () => { menu.col = 1; menu.si = k; choose(s); }, () => { menu.col = 1; menu.si = k; });
      });
      drawCoins(312, 8);
    }
    text(game.mode === 'menu' ? 'W S CHOOSE - A D SIDEBAR - ENTER PICK' : 'W S TO CHOOSE - ENTER TO PICK - ESC TO GO BACK', 160, 150, 1, '#ffffff', 'center');
  } else if (game.mode === 'pickname') {
    text('PICK YOUR RANKED NAME', 160, 52, 1, '#ffffff', 'center');
    text(ranked.typed + (T % 30 < 15 ? '_' : ' '), 160, 70, 3, '#ffffff', 'center');
    text('3-12 LETTERS OR NUMBERS', 160, 100, 1, '#c8c8c8', 'center');
    text('EVERYONE SEES IT - YOU CAN\'T CHANGE IT LATER', 160, 110, 1, '#c8c8c8', 'center');
    if (ranked.nameErr) text(ranked.nameErr, 160, 124, 1, '#ffffff', 'center');
    text(ranked.typed.trim().length >= 3 ? 'ENTER TO SAVE - ESC TO GO BACK' : 'ESC TO GO BACK', 160, 150, 1, '#9a9a9a', 'center');
    hit('namesave', 60, 146, 200, 12, () => { if (ranked.typed.trim().length >= 3) saveName(); else goTo('play', 1); });
  } else if (game.mode === 'controls') {
    const lines = [
      ['P1', 'WASD MOVE  F PUNCH  G KICK  H SHOOT'],
      ['P2', 'ARROWS  J PUNCH  K KICK  L SHOOT'],
      ['', 'TAP FORWARD TWICE TO DASH'],
      ['', 'HOLD BACK TO BLOCK - DOWN+BACK FOR LOW'],
      ['', 'DOWN+PUNCH UPPERCUT   DOWN+KICK SWEEP'],
      ['', 'CLOSE + FORWARD + PUNCH THROW'],
      ['', '1-4 QUICK CHAT (P2: 7-0)'],
      ['', 'ONLINE: T CHAT  V VOICE  M MUTE THEM'],
    ];
    text('CONTROLS', 160, 52, 1, '#ffffff', 'center');
    lines.forEach(([who, s], k) => text((who ? who + '  ' : '') + s, 160, 66 + k * 10, 1, '#ffffff', 'center'));
    text('ENTER OR ESC TO GO BACK', 160, 152, 1, '#9a9a9a', 'center');
    hit('controlsback', 0, 0, W, H, goBack);
  } else if (game.mode === 'board') {
    text('TOP 20', 160, 50, 1, '#ffffff', 'center');
    if (!ranked.board) text('LOADING...', 160, 80, 1, '#ffffff', 'center');
    else ranked.board.forEach((r, k) => {
      const x = k < 10 ? 8 : 164, y = 60 + (k % 10) * 8;
      text((k + 1) + '. ' + r.name, x, y, 1, r.name === (ranked.me && ranked.me.name) ? '#ffffff' : '#c8c8c8');
      text(rankOf(r.points) + ' ' + r.points, x + 148, y, 1, '#ffffff', 'right');
    });
    text('ENTER OR ESC TO GO BACK', 160, 148, 1, '#9a9a9a', 'center');
    hit('boardback', 0, 0, W, H, goBack);
  } else if (game.mode === 'join') {
    text('TYPE YOUR FRIEND\'S ROOM CODE', 160, 66, 1, '#ffffff', 'center');
    const shown = (net.typed + '____').slice(0, 4).split('').join(' ');
    text(shown, 160, 82, 5, '#ffffff', 'center');
    text(net.typed.length === 4 ? 'PRESS ENTER TO JOIN' : 'ESC TO GO BACK', 160, 124, 1, '#ffffff', 'center');
    hit('joingo', 80, 120, 160, 12, () => { if (net.typed.length === 4) joinGame(); else goBack(); });
  } else {
    if (net.role === 'host') {
      text('ROOM CODE', 160, 62, 1, '#ffffff', 'center');
      text(net.code.split('').join(' '), 160, 74, 5, '#ffffff', 'center');
      text('YOUR FRIEND PICKS JOIN AND TYPES THIS IN', 160, 110, 1, '#ffffff', 'center');
    } else text('JOINING ROOM ' + net.code, 160, 80, 2, '#ffffff', 'center');
    text(net.status, 160, 126, 1, T % 50 < 34 ? '#ffffff' : '#9a9a9a', 'center');
    text('ESC TO CANCEL', 160, 146, 1, '#9a9a9a', 'center');
    hit('lobbycancel', 100, 142, 120, 12, () => leaveOnline());
  }
  if (menu.msgT > 0) text(menu.msg, 160, 160, 1, '#ffffff', 'center');
}
function draw() {
  HITS = [];
  if (game.mode === 'title') { drawTitle(); if (menu.msgT > 0) text(menu.msg, 160, 160, 1, '#ffffff', 'center'); }
  else if (['account', 'shop', 'crate'].includes(game.mode)) drawProfileScreens();
  else if (game.mode === 'authform') drawAuthForm();
  else if (MENUS[game.mode] || ['join', 'lobby', 'board', 'controls', 'pickname'].includes(game.mode)) drawMenu();
  else if (game.mode === 'select') drawSelect();
  else { drawWorld(); drawHud(); drawBanners(); }
  drawChat();
  mono();
  present();
}

let acc = 0, last = performance.now();
function frame(now) {
  acc += Math.min(100, now - last);
  last = now;
  while (acc >= 1000 / 60) {
    step();
    if (net.role === 'host') sendSnapshot();
    acc -= 1000 / 60;
  }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
