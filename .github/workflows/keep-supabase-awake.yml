# Free Supabase projects go to sleep after 7 days with no visitors.
# This visits the ranked database once a day so it never does.
name: Keep Supabase awake

on:
  schedule:
    - cron: '0 12 * * *'   # every day at 12:00 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the ranked database
        run: |
          curl -fsS "${{ secrets.SUPABASE_URL }}/rest/v1/players?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" > /dev/null
          echo "Supabase is awake"
